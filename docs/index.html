<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDA-ZIP — Em Desenvolvimento</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }
    h1 { color: #fff; font-size: 1.5rem; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 0.95rem; margin-bottom: 24px; }
    a {
      background: var(--accent);
      color: #0d1117;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🚧 Módulo em Desenvolvimento</h1>
    <p>Esta seção da arquitetura do JDA-ZIP Protocol está sendo estruturada para as próximas versões do projeto.</p>
    <a href="index.html">Voltar à Central de Operações</a>
  </div>
</body>
</html>
