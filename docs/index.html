<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDA-ZIP Protocol — Central de Operações</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .wrapper {
      max-width: 650px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 4px;
    }

    header h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    header p {
      font-size: 0.95rem;
      color: var(--muted);
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(88, 166, 255, 0.1);
    }

    .card-icon {
      font-size: 1.8rem;
    }

    .card h3 {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 2px;
    }

    .card p {
      font-size: 0.85rem;
      color: var(--muted);
    }

    footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <h1>JDA-ZIP</h1>
      <h2>Semantic Compression Protocol</h2>
      <p>Central de operações — Selecione um módulo para começar</p>
    </header>

    <a href="laboratorio.html" class="card">
      <div class="card-icon">🧪</div>
      <div>
        <h3>Laboratório</h3>
        <p>Testes de compressão, simulação e métricas em tempo real.</p>
      </div>
    </a>

    <a href="#" class="card" onclick="alert('Módulo em estruturação para as próximas etapas.'); return false;" style="opacity: 0.6;">
      <div class="card-icon">🗄️</div>
      <div>
        <h3>Dicionários (JSON)</h3>
        <p>Gerenciamento e mapeamento de vocabulários globais e chaves.</p>
      </div>
    </a>

    <footer>
      JDA-ZIP Protocol &bull; Arquitetura Modular
    </footer>
  </div>

</body>
</html>
