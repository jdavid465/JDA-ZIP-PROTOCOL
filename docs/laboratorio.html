<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDA-ZIP — Laboratório</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.4rem; color: #fff; }
    a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media(min-width: 600px) {
      .config-grid { grid-template-columns: 2fr 1fr; }
    }

    .box-config {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .box-config h3 {
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 10px;
    }

    .options-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .option-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
      transition: all 0.2s;
    }

    .option-btn:hover, .option-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(88, 166, 255, 0.05);
    }

    /* Menu Gaveta de Fatiamento */
    .dropdown {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .dropbtn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropbtn:hover { border-color: var(--accent); }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: var(--panel);
      min-width: 100%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 6px;
      z-index: 10;
      margin-top: 4px;
    }

    .dropdown-content button {
      color: var(--text);
      padding: 10px 14px;
      text-decoration: none;
      display: block;
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .dropdown-content button:hover {
      background: rgba(88, 166, 255, 0.1);
      color: var(--accent);
    }

    .dropdown.show .dropdown-content { display: block; }

    /* Área de Texto Bloqueável */
    .editor-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 16px;
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .editor-grid.unlocked {
      opacity: 1;
      pointer-events: auto;
    }

      border: 1px solid var(--border);
