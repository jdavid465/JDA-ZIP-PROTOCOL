<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDA-ZIP — Laboratório</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --muted: #8b949e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    header {
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.4rem; color: #fff; }
    a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media(min-width: 600px) {
      .config-grid { grid-template-columns: 2fr 1fr; }
    }

    .box-config {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .box-config h3 {
      font-size: 0.95rem;
      color: #fff;
      margin-bottom: 10px;
    }

    .options-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .option-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: center;
      transition: all 0.2s;
    }

    .option-btn:hover, .option-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(88, 166, 255, 0.05);
    }

    /* Menu Gaveta de Fatiamento (Apenas Números) */
    .dropdown {
      position: relative;
      display: inline-block;
      width: 100%;
    }

    .dropbtn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dropbtn:hover { border-color: var(--accent); }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: var(--panel);
      min-width: 100%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      border-radius: 6px;
      z-index: 10;
      margin-top: 4px;
    }

    .dropdown-content button {
      color: var(--text);
      padding: 10px 14px;
      text-decoration: none;
      display: block;
      width: 100%;
      background: none;
      border: none;
      text-align: left;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .dropdown-content button:hover {
      background: rgba(88, 166, 255, 0.1);
      color: var(--accent);
    }

    .dropdown.show .dropdown-content { display: block; }

    /* Área de Texto Bloqueável */
    .editor-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 16px;
      opacity: 0.5;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .editor-grid.unlocked {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    label { font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; color: var(--accent); }

    textarea {
      width: 100%;
      height: 200px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px;
      font-family: monospace;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
    }

    .controls { margin-bottom: 16px; }

    .action-btn {
      background: var(--accent-hover);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 0.9rem;
    }

    .action-btn:disabled { background: var(--border); cursor: not-allowed; }

    .stats {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .stat-value { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .stat-label { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Laboratório JDA-ZIP</h1>
      <a href="index.html">&larr; Voltar à Central</a>
    </header>

    <div class="config-grid">
      <!-- Origem do Dicionário (Apenas Gerar e Importar) -->
      <div class="box-config">
        <h3>1. Origem do Dicionário</h3>
        <div class="options-row">
          <button class="option-btn" id="btn-gerar" onclick="selecionarModo('gerar')">🔄 Gerar Automático</button>
          <label class="option-btn" id="btn-importar" style="cursor: pointer;">
            📁 Importar JSON
            <input type="file" id="file-input" accept=".json" style="display:none;" onchange="importarDicionario(event)">
          </label>
        </div>
      </div>

      <!-- Menu Gaveta: Modo de Fatiamento (Apenas Números) -->
      <div class="box-config">
        <h3>2. Modo de Fatiamento</h3>
        <div class="dropdown" id="fatiamento-dropdown">
          <button class="dropbtn" onclick="toggleDropdown()">
            <span id="fatiamento-label">1</span> ▼
          </button>
          <div class="dropdown-content">
            <button onclick="mudarFatiamento(1)">1</button>
            <button onclick="mudarFatiamento(2)">2</button>
            <button onclick="mudarFatiamento(3)">3</button>
            <button onclick="mudarFatiamento(4)">4</button>
            <button onclick="mudarFatiamento(5)">5</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Área de Texto -->
    <div class="editor-grid" id="editor-area">
      <div class="panel">
        <label for="input-text">Texto Original (Cole aqui):</label>
        <textarea id="input-text" placeholder="Cole o texto ou relatório aqui..."></textarea>
      </div>

      <div class="panel">
        <label for="output-text">Prévia da Compactação (Temporário em RAM):</label>
        <textarea id="output-text" readonly placeholder="A prévia aparecerá aqui..."></textarea>
      </div>
    </div>

    <div class="controls">
      <button class="action-btn" id="btn-compactar" disabled onclick="executarEExportar()">
        💾 Compactar e Baixar Pacote (.jda + .json)
      </button>
    </div>

    <div class="stats">
      <div><span class="stat-value" id="orig-size">0 B</span><span class="stat-label">Original</span></div>
      <div><span class="stat-value" id="comp-size">0 B</span><span class="stat-label">Compactado</span></div>
      <div><span class="stat-value" id="ratio-val">0%</span><span class="stat-label">Redução</span></div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script>
    let modoSelecionado = null;
    let dicionarioAtivo = {};
    let tamanhoFatiamento = 1;

    function toggleDropdown() {
      document.getElementById('fatiamento-dropdown').classList.toggle('show');
    }

    window.onclick = function(event) {
      if (!event.target.matches('.dropbtn') && !event.target.matches('.dropbtn *')) {
        var dropdowns = document.getElementsByClassName("dropdown");
        for (var i = 0; i < dropdowns.length; i++) {
          var openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    }

    function mudarFatiamento(valor) {
      tamanhoFatiamento = valor;
      document.getElementById('fatiamento-label').innerText = valor;
      document.getElementById('fatiamento-dropdown').classList.remove('show');
      processarTextoDinamico();
    }

    function selecionarModo(modo) {
      modoSelecionado = modo;
      document.querySelectorAll('.box-config:first-child .option-btn').forEach(btn => btn.classList.remove('active'));

      if (modo === 'gerar') {
        document.getElementById('btn-gerar').classList.add('active');
        dicionarioAtivo = null;
      }

      desbloquearArea();
      processarTextoDinamico();
    }

    function importarDicionario(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const content = JSON.parse(e.target.result);
          dicionarioAtivo = content.mapeamentos || content;
          modoSelecionado = 'importado';
          
          document.querySelectorAll('.box-config:first-child .option-btn').forEach(btn => btn.classList.remove('active'));
          document.getElementById('btn-importar').classList.add('active');
          
          desbloquearArea();
          processarTextoDinamico();
          alert("Dicionário " + file.name + " carregado com sucesso!");
        } catch(err) {
          alert("Erro ao ler o arquivo JSON.");
        }
      };
      reader.readAsText(file);
    }

    function desbloquearArea() {
      document.getElementById('editor-area').classList.add('unlocked');
      document.getElementById('btn-compactar').removeAttribute('disabled');
    }

    function processarTextoDinamico() {
      const texto = document.getElementById('input-text').value;
      if (!texto) return;

      let dictParaUso = dicionarioAtivo;

      if (modoSelecionado === 'gerar') {
        dictParaUso = gerarDicionarioDinamico(texto, tamanhoFatiamento);
      }

      const res = compactarJDAZIP(texto, dictParaUso, tamanhoFatiamento);
      document.getElementById('output-text').value = res.textoCompactado;

      const origBytes = new Blob([texto]).size;
      const compBytes = new Blob([res.textoCompactado]).size;
      const economia = origBytes > 0 ? (((origBytes - compBytes) / origBytes) * 100).toFixed(1) : 0;

      document.getElementById('orig-size').innerText = origBytes + " B";
      document.getElementById('comp-size').innerText = compBytes + " B";
      document.getElementById('ratio-val').innerText = (economia > 0 ? "-" + economia : "0") + "%";
    }

    document.getElementById('input-text').addEventListener('input', processarTextoDinamico);

    function executarEExportar() {
      const textoOriginal = document.getElementById('input-text').value;
      if (!textoOriginal) {
        alert("Digite ou cole algum texto antes de compactar.");
        return;
      }

      let dictFinal = dicionarioAtivo;
      if (modoSelecionado === 'gerar') {
        dictFinal = gerarDicionarioDinamico(textoOriginal, tamanhoFatiamento);
      }

      const resultado = compactarJDAZIP(textoOriginal, dictFinal, tamanhoFatiamento);

      baixarArquivoLocal(resultado.textoCompactado, 'texto_compactado.jda', 'text/plain');

      const jsonDict = JSON.stringify({
        versao: "1.2",
        fatiamento: tamanhoFatiamento,
        geradoEm: new Date().toISOString(),
        mapeamentos: dictFinal
      }, null, 2);

      setTimeout(() => {
        baixarArquivoLocal(jsonDict, 'dicionario_sessao.json', 'application/json');
      }, 300);
    }
  </script>
</body>
</html>
