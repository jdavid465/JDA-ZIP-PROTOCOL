<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JDA-ZIP — Laboratório</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.4rem; color: #fff; }
    a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    .editor-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
    @media(min-width: 768px) { .editor-grid { grid-template-columns: 1fr 1fr; } }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; }
    label { font-weight: 600; margin-bottom: 6px; font-size: 0.85rem; color: var(--accent); }
    textarea { width: 100%; height: 220px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 10px; font-family: monospace; font-size: 0.85rem; resize: vertical; outline: none; }
    .stats { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; justify-content: space-around; text-align: center; }
    .stat-value { font-size: 1.2rem; font-weight: bold; color: #fff; }
    .stat-label { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Laboratório de Testes</h1>
      <a href="index.html">&larr; Voltar à Central</a>
    </header>

    <div class="editor-grid">
      <div class="panel">
        <label for="input-text">Texto Original:</label>
        <textarea id="input-text" placeholder="Cole seu texto ou tabela aqui..."></textarea>
      </div>
      <div class="panel">
        <label for="output-text">Texto Processado:</label>
        <textarea id="output-text" readonly placeholder="O resultado aparecerá aqui..."></textarea>
      </div>
    </div>

    <div class="stats">
      <div><span class="stat-value" id="orig-size">0 B</span><span class="stat-label">Original</span></div>
      <div><span class="stat-value" id="comp-size">0 B</span><span class="stat-label">Processado</span></div>
      <div><span class="stat-value" id="ratio-val">0%</span><span class="stat-label">Redução</span></div>
    </div>
  </div>

  <!-- Importando o motor modular -->
  <script src="engine.js"></script>
  <script>
    let dicionarioGlobal = {};

    // Carrega o dicionario.json de forma assíncrona
    async function carregarDicionario() {
      try {
        const response = await fetch('dictionary.json');
        const data = await response.json();
        dicionarioGlobal = data.mapeamentos || {};
      } catch (e) {
        console.log("Dicionário externo não carregado, usando execução padrão.");
      }
    }

    function executarProcessamento() {
      const texto = document.getElementById('input-text').value;
      const resultado = compactarJDAZIP(texto, dicionarioGlobal);

      document.getElementById('output-text').value = resultado;

      const origBytes = new Blob([texto]).size;
      const compBytes = new Blob([resultado]).size;
      const economia = origBytes > 0 ? (((origBytes - compBytes) / origBytes) * 100).toFixed(1) : 0;

      document.getElementById('orig-size').innerText = origBytes + " B";
      document.getElementById('comp-size').innerText = compBytes + " B";
      document.getElementById('ratio-val').innerText = (economia > 0 ? "-" + economia : "0") + "%";
    }

    document.getElementById('input-text').addEventListener('input', executarProcessamento);

    // Inicializa carregando o dicionário ao abrir a página
    carregarDicionario();
  </script>
</body>
</html>
